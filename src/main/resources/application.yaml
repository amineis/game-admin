spring:
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: gameadmin

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/gameadmin-realm
          jwk-set-uri: http://localhost:8081/realms/gameadmin-realm/protocol/openid-connect/certs

  datasource:
    url: jdbc:postgresql://localhost:5432/gameadmin
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: false

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    persist-authorization: true   
    tags-sorter: alpha          
    operations-sorter: method    
  show-actuator: true
