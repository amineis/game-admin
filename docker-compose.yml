services:
  postgres:
    image: postgres:16
    container_name: gameadmin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gameadmin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gameadmin"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: gameadmin-keycloak
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: ["start-dev"]
    ports:
      - "8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gameadmin-app
    restart: unless-stopped
    depends_on:
      - postgres
      - keycloak
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  keycloak_data:
